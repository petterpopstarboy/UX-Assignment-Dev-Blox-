<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Dev Bloxs - Profile</title>

      <!-- Import Bootstrap -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">

      <link href="style.css" rel="stylesheet">
  </head>

  <body class="d-flex flex-column min-vh-100 m-0 auth-page">
      <!-- Top Bar -->
      <header class="sticky-top">
          <div class="container-fluid py-2 d-flex justify-content-between align-items-center border-bottom border-primary" style="background-color: white;">
              <div class="d-flex align-items-center">
                  <a href="Homepage.html" class="text-decoration-none">
                    <h2 class="text-primary m-0 me-4">Dev Blox</h2>
                  </a>
                    <!-- PC Nav buttons, only visible in wider displays ("d-md class determines its range of visibility") -->
                    <div class="d-none d-md-flex gap-3">
                        <button class="btn nav-btn" onclick="window.open('Homepage.html', '_self')">Home</button>
                        <button class="btn nav-btn" onclick="window.open('Guide Page.html', '_self')">Guides</button>
                        <button class="btn nav-btn" onclick="window.open('Community.html', '_self')">Community</button>
                        <button class="btn nav-btn" onclick="window.open('News Letter.html', '_self')">News</button>
                        <button class="btn nav-btn" onclick="window.open('Contact Us.html', '_self')">Contact</button>
                    </div>
                </div>

                <!-- Account button -->
                <a href="Profile.html" id="accountBtn" class="btn btn-outline-primary fw-bold d-flex align-items-center border-2">
                <span id="accountLabel">Sign in</span>
                <img src="Images/user_profile_icon.jpg" alt="Profile" class="rounded-circle ms-2" width="25" height="25">
                </a>
            </div>

            <!-- Narrow Screen Nav Buttons -->
            <div class="d-flex d-md-none justify-content-center flex-wrap gap-2" style="background-color: rgb(13, 110, 253);">
                <button class="btn btn-primary btn-sm" onclick="window.open('Homepage.html', '_self')">Home</button>
                <button class="btn btn-primary btn-sm" onclick="window.open('Guide Page.html', '_self')">Guides</button>
                <button class="btn btn-primary btn-sm" onclick="window.open('Community.html', '_self')">Community</button>
                <button class="btn btn-primary btn-sm" onclick="window.open('News Letter.html', '_self')">News</button>
                <button class="btn btn-primary btn-sm" onclick="window.open('Contact Us.html', '_self')">Contact</button>
          </div>
      </header>

      <!-- Profile content -->
    <main class="flex-grow-1 d-flex align-items-center">
      <div class="container d-flex justify-content-center">
        <div class="card w-100 rounded-5 mt-3 shadow-sm">
          <div class="card-body p-4 text-center">

            <img src="Images/user_profile_icon.jpg" alt="Profile" class="rounded-circle avatar-lg mb-3">

            <h3 class="card-title mb-1" id="profileUsername">Loading...</h3>
            <p class="text-muted mb-4" id="profileEmail"></p>

            <div id="noEmailNotice" class="alert alert-warning d-none" role="alert">
              No email on file for this account.
            </div>

            <hr>

            <div class="d-grid gap-2 mt-3">
              <button id="logoutBtn" class="btn btn-danger">Log Out</button>
              <button id="backBtn" class="btn btn-primary w-100 mt-2">&larr; Back</button>
            </div>

          </div>
        </div>
      </div>
    </main>

      <!-- Footer -->
      <footer class="bg-navy text-white text-center fw-bold py-2">
          <span>Dev Blox&trade; Inc. All Rights Reserved</span>
      </footer>

      <script>
        // Checks localStorage for logged-in username.
        // If localStroage found the username, changes "Sign in" text to logged-in username.
        // If username not found, leaves the text as "Sign in" and directs to login page if clicked.
        const loggedInUser = localStorage.getItem("loggedInUser");
        if (!loggedInUser) {
        window.location.href = "Log in and Log out.html";
        }

        // Reads the list of registered users from localStorage.
        // Falls back to an empty array if none exist yet.
        function getUsers() {
        return JSON.parse(localStorage.getItem("users") || "[]");
        }

        // Look up this user's details (e.g. email) from the localStorage records.
        // Finds profile that matches username.
        // Hardcoded demo account ("admin") won't have a record here.
        const users = getUsers();
        const userRecord = users.find(
        u => u.username.toLowerCase() === loggedInUser.toLowerCase()
        );

        // Takes username and place it in the accounts profile section and header.
        // Account profile section always shows current logged-in user.
        document.getElementById("profileUsername").textContent = loggedInUser;
        document.getElementById("accountLabel").textContent = loggedInUser;

        // Shows the user's email if a matching record exists (registered users) in profile.
        // Otherwise (e.g. admin demo account), shows a "No email on file for this account." notice.
        if (userRecord && userRecord.email) {
        document.getElementById("profileEmail").textContent = userRecord.email;
        } else {
        document.getElementById("noEmailNotice").classList.remove("d-none");
        }

        // Clears the logged-in user when logout button clicked.
        // Redirects to login page.
        document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("loggedInUser");
        window.location.href = "Log in and Log out.html";
        });

        // Back button: go to whatever page the user came from.
        // Falls back to Homepage if there's no previous page in this tab's history (e.g. Profile was opened directly, not navigated to from elsewhere)
        document.getElementById("backBtn").addEventListener("click", () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "Homepage.html";
        }
        });
      </script>
  </body>
</html>
