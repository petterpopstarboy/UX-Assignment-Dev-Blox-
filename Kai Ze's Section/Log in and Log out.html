<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dev Bloxs - Login</title>
 
        <!-- Import Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
 
        <link href="style.css" rel="stylesheet">
    </head>
 
    <body class="d-flex flex-column min-vh-100 m-0 auth-page">
        <!-- Top Bar -->
        <header class="sticky-top">
            <div class="container-fluid py-2 d-flex justify-content-between align-items-center border-bottom border-primary" style="background-color: white;">
                <div class="d-flex align-items-center">
                   <a href="Homepage.html" class="text-decoration-none">
                     <h2 class="text-primary m-0 me-4">Dev Blox</h2>
                   </a>
 
                    <!-- PC Nav buttons, only visible in wider displays ("d-md class determines its range of visibility") -->
                    <div class="d-none d-md-flex gap-3 invisible">
                        <button class="btn nav-btn">Home</button>
                        <button class="btn nav-btn">Guides</button>
                        <button class="btn nav-btn">Community</button>
                        <button class="btn nav-btn">News</button>
                        <button class="btn nav-btn">Contact</button>
                    </div>
                </div>
 
            </div>
        </header>
          
      <main class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="container">
 
          <!-- Login screen -->
          <div id="loginScreen" class="card w-100 rounded-5 mt-3 shadow-sm mx-auto">
            <div class="card-body p-4">
              <h3 class="card-title text-center mb-4">Sign In</h3>
 
              <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>
 
              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="username" class="form-label">Username</label>
                  <input type="text" class="form-control" id="username" required>
                  <div class="invalid-feedback">Please enter your username.</div>
                </div>
 
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" required>
                  <div class="invalid-feedback">Please enter your password.</div>
                </div>
 
                <div class="mb-3 form-check">
                  <input type="checkbox" class="form-check-input" id="showPassword">
                  <label class="form-check-label" for="showPassword">Show password</label>
                </div>
 
                <button type="submit" class="btn btn-primary w-100">Log In</button>
                <a href="Homepage.html" class="btn btn-danger w-100 mt-2">&larr; Back</a>
              </form>
 
              <p class="text-muted small mt-3 mb-0 text-center">
               credentials: <strong>admin</strong> / <strong>password123</strong>
              </p>
 
              <p class="text-center small mt-2 mb-0">
              Don't have an account? <a href="Sign up.html">Sign up</a>
              </p>
 
            </div>
          </div>
        </div>
      </main>

        <!-- Footer -->
        <footer class="bg-navy text-white text-center fw-bold py-2">
          <span>Dev Blox&trade; Inc. All Rights Reserved</span>
        </footer>

       <script>
        // Hardcoded demo account for testing.
        // Allows log in without registering a real user first.
        const DEMO_USER = "admin";
        const DEMO_PASS = "password123";

        // Reads the list of registered users from localStorage.
        // Falls back to an empty array if none exist yet
        function getUsers() {
          return JSON.parse(localStorage.getItem("users") || "[]");
        }

        // Grabs each form element once by its ID and saves it to a variable,
        // so we can reuse it later instead of calling getElementById again.
        const loginForm = document.getElementById("loginForm");
        const loginAlert = document.getElementById("loginAlert");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const showPasswordCheckbox = document.getElementById("showPassword");
        
        // Shows/hides the alert box used for login error messages.
        // hideAlert() is called at the start of each attempt to clear old errors.
        function showAlert(message) {
          loginAlert.textContent = message;
          loginAlert.classList.remove("d-none");
        }
        function hideAlert() {
          loginAlert.classList.add("d-none");
        }

        // Toggles the password field between hidden and visible text.
        // Triggered whenever the "show password" checkbox changes.
        showPasswordCheckbox.addEventListener("change", () => {
          passwordInput.type = showPasswordCheckbox.checked ? "text" : "password";
        });

        // Prevent default page reload so we can handle login with JavaScript.
        // Clear any leftover error messages from a previous attempt.
        loginForm.addEventListener("submit", function (e) {
          e.preventDefault();
          hideAlert();
        
          // Runs form validation (e.g. required fields).
          // If invalid, show validation styling and stop here.
          if (!loginForm.checkValidity()) {
            loginForm.classList.add("was-validated");
            return;
          }
          loginForm.classList.add("was-validated");
        
          // Removes any whitespace from front and end of the username.
          // Password does not trim as spaces could be intentional.
          const username = usernameInput.value.trim();
          const password = passwordInput.value;
        
          // Check the entered info against demo account and any registered users.
          // Username comparison is case-insensitive, while password must match exactly.
          const isDemoUser = username === DEMO_USER && password === DEMO_PASS;
          const matchedUser = getUsers().find(
            u => u.username.toLowerCase() === username.toLowerCase() && u.password === password
          );
        
          // Store which username is now logged in.
          // Other pages (Homepage, profile) read this to know who is signed in.
          // If no match found, show error message.
          if (isDemoUser || matchedUser) {
            const finalUsername = isDemoUser ? DEMO_USER : matchedUser.username;

            localStorage.setItem("loggedInUser", finalUsername);
            window.location.href = "Homepage.html";
          } else {
            showAlert("Invalid username or password. Try again.");
          }
        });
       </script>
    </body>
</html>
