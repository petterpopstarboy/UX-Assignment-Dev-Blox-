<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Dev Bloxs - Profile</title>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">

      <link href="style.css" rel="stylesheet">
  </head>

  <body class="d-flex flex-column min-vh-100 m-0 auth-page">
      <!-- Top Bar -->
      <header class="sticky-top">
          <div class="container-fluid py-2 d-flex justify-content-between align-items-center border-bottom border-primary" style="background-color: white;">
              <div class="d-flex align-items-center">
                  <a href="Homepage.html" class="text-decoration-none">
                    <h2 class="text-primary m-0 me-4">Dev Blox</h2>
                  </a>

                  <!-- PC Nav buttons, only visible in wider displays ("d-md class determines its range of visibility") -->
                  <div class="d-none d-md-flex gap-3">
                      <a href="Homepage.html" class="btn nav-btn">Home</a>
                      <a href="Guides.html" class="btn nav-btn">Guides</a>
                      <a href="Community.html" class="btn nav-btn">Community</a>
                      <a href="News Letter.html" class="btn nav-btn">News</a>
                      <a href="Contact Us.html" class="btn nav-btn">Contact</a>
                  </div>
              </div>

                  <!-- Account button -->
                  <a href="Profile.html" id="accountBtn" class="btn btn-outline-primary fw-bold  d-flex align-items-center">
                    <span id="accountLabel">Sign in</span>
                    <img src="Images/user_profile_icon.jpg" alt="Profile" class="rounded-circle ms-2" width="25" height="25">
                  </a>
              </div>

          <!-- Narrow Screen Nav Buttons -->
          <div class="d-flex d-md-none justify-content-center flex-wrap gap-2" style="background-color: rgb(13, 110, 253);">
            <a href="Homepage.html" class="btn btn-primary btn-sm">Home</a>
            <a href="Guides.html" class="btn btn-primary btn-sm">Guides</a>
            <a href="Community.html" class="btn btn-primary btn-sm">Community</a>
            <a href="News Letter.html" class="btn btn-primary btn-sm">News</a>
            <a href="Contact Us.html" class="btn btn-primary btn-sm">Contact</a>
          </div>
      </header>

    <main class="flex-grow-1 d-flex align-items-center">
      <div class="container d-flex justify-content-center">
        <div class="card w-100 rounded-5 mt-3 shadow-sm">
          <div class="card-body p-4 text-center">

            <img src="Images/user_profile_icon.jpg" alt="Profile" class="rounded-circle avatar-lg mb-3">

            <h3 class="card-title mb-1" id="profileUsername">Loading...</h3>
            <p class="text-muted mb-4" id="profileEmail"></p>

            <div id="noEmailNotice" class="alert alert-warning d-none" role="alert">
              No email on file for this account.
            </div>

            <hr>

            <div class="d-grid gap-2 mt-3">
              <button id="logoutBtn" class="btn btn-danger">Log Out</button>
              <button id="backBtn" class="btn btn-primary w-100 mt-2">&larr; Back</button>
            </div>

          </div>
        </div>
      </div>
    </main>

      <!-- Footer -->
      <footer class="bg-navy text-white text-center fw-bold py-2">
          <span>Dev Blox&trade; Inc. All Rights Reserved</span>
      </footer>

      <script>
        //checks local storage for username
        //if local stroage find the username, changes "Sign in" text to logged in username
        //if username not found, leaves the text as "Sign in" and directs to login page if pressed
        const loggedInUser = localStorage.getItem("loggedInUser");
        if (!loggedInUser) {
        window.location.href = "Log in and Log out.html";
        }

        //getting information of registered users
        //if the database is empty, give a blank text representation of empty list
        function getUsers() {
        return JSON.parse(localStorage.getItem("users") || "[]");
        }

        //look up this user's details (email) from the local storage records.
        //finds profile that matches username
        //hardcoded demo account ("admin") won't have a record here.
        const users = getUsers();
        const userRecord = users.find(
        u => u.username.toLowerCase() === loggedInUser.toLowerCase()
        );

        //takes username and place it in the accounts profile section and header
        //account profile section always shows current user
        document.getElementById("profileUsername").textContent = loggedInUser;
        document.getElementById("accountLabel").textContent = loggedInUser;

        //if user is normal registered acc, find profile with usename and email, puts it in the profile section
        //if admin, it is not in local storage, removes display none of bootstrap and shows "No email on file for this account."
        if (userRecord && userRecord.email) {
        document.getElementById("profileEmail").textContent = userRecord.email;
        } else {
        document.getElementById("noEmailNotice").classList.remove("d-none");
        }

        //remove user info when user press log out
        //redirect to login page 
        document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("loggedInUser");
        window.location.href = "Log in and Log out.html";
        });

        //back button: go to whatever page the user came from, if possible
        //falls back to Homepage if there's no previous page in this tab's history
        //(e.g. Profile was opened directly, not navigated to from elsewhere)
        document.getElementById("backBtn").addEventListener("click", () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "Homepage.html";
        }
        });
      </script>
  </body>
</html>
