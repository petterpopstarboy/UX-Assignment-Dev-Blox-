                if (currentUser === "Guest") return; // guests never save

            // --- Persist posts via localStorage ---
            // Same pattern as community members: the hardcoded posts above
            // act as starting seed data. If something's already saved, it
            // replaces the hardcoded set entirely, so posts (and edits,
            // likes, comments, deletions) actually stick around across
            // reloads and different logins on this browser.
            //
            // Important: createdAt fields are real Date objects (used via
            // .toISOString() throughout), but JSON can't store Date objects
            // directly — they get flattened to plain strings. So loadPosts()
            // manually converts every post's and every comment's createdAt
            // back into a real Date after reading it from localStorage.
            function loadPosts() {
                const saved = JSON.parse(localStorage.getItem("posts"));
                if (!saved) return; // nothing saved yet — keep the hardcoded seed data

                Object.values(saved).forEach(post => {
                    if (post.createdAt) post.createdAt = new Date(post.createdAt);
                    if (Array.isArray(post.commentList)) {
                        post.commentList.forEach(c => {
                            if (c.createdAt) c.createdAt = new Date(c.createdAt);
                        });
                    }
                });

                posts = saved;
            }
            function savePosts() {
                localStorage.setItem("posts", JSON.stringify(posts));
            }

            // Converts an uploaded image file into a base64 data URL, which
            // (unlike URL.createObjectURL) can actually be stored in
            // localStorage and still work after a page reload.
            function fileToBase64(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            // But each community's actual member list is loaded from
            // localStorage instead, starting empty — this ignores the
            // hardcoded placeholder names above (those are just test data)
            // so real join actions actually persist across reloads, on
            // any browser/computer this runs on.
            function loadCommunityMembers() {
                const saved = JSON.parse(localStorage.getItem("communityMembers") || "{}");
                communities.forEach(c => {
                    c.members = saved[c.name] || [];
                });
            }
            function saveCommunityMembers() {
                const data = {};
                communities.forEach(c => {
                    data[c.name] = c.members;
                });
                localStorage.setItem("communityMembers", JSON.stringify(data));
            }
            
            loadPosts();
            loadRecentlyViewed();
            loadCommunityMembers();

            let joinedCommunities = [];
            function updateJoinedCommunities() {
                joinedCommunities = communities
                    .filter(c => c.members.includes(currentUser))
                    .map(c => c.name);
            }

            // Populate "Add More+"
            function populateCommunityList() {
                const listContainer = document.getElementById("communityList");
                listContainer.innerHTML = "";

                communities.forEach(c => {
                    const btn = document.createElement("button");
                    btn.className = "community-btn btn w-100 mb-2 p-0 position-relative overflow-hidden";

                    btn.innerHTML = `
                        <!-- Banner image -->
                        <img src="${c.banner}" alt="${c.name} banner" class="community-bg">

                        <!-- Gradient overlay (for readability) -->

                        <!-- Text content (always above gradient) -->
                        <div class="community-text position-relative p-3">
                            <h5 class="mb-0">${c.name}</h5>
                            <small class="text-muted">${c.members.length} members</small>
                        </div>
                    `;

                    btn.addEventListener("click", () => {
                        showCommunityPage(c.name);
                        document.getElementById("postPanel").classList.add("d-none");
                        document.getElementById("postsWrapper").classList.remove("d-none");
                        window.scrollTo({ top: 0, behavior: "auto" });
                    });

                    listContainer.appendChild(btn);
                });
            }
            document.getElementById("addMoreBtn").addEventListener("click", () => {
                populateCommunityList();
            });
            populateCommunityList();
            
            // Auto Extend Height of .extendingTextBox //
            document.querySelectorAll('.extendingTextBox').forEach(textarea => {
                textarea.addEventListener('input', function() {
                    this.style.height = 'auto';              // reset height
                    this.style.height = this.scrollHeight + 'px'; // expand to fit content
                });
            });

            // Converts "createdAt" into recency text //
            function timeAgo(dateString) {
                const now = new Date();
                const created = new Date(dateString);
                const diffMs = now - created;

                const seconds = Math.floor(diffMs / 1000);
                const minutes = Math.floor(seconds / 60);
                const hours   = Math.floor(minutes / 60);
                const days    = Math.floor(hours / 24);
                const weeks   = Math.floor(days / 7);
                const months  = Math.floor(days / 30);
                const years   = Math.floor(days / 365);

                if (years > 0) return `Created ${years} year${years > 1 ? 's' : ''} ago`;
                if (months > 0) return `Created ${months} month${months > 1 ? 's' : ''} ago`;
                if (weeks > 0) return `Created ${weeks} week${weeks > 1 ? 's' : ''} ago`;
                if (days > 0) return `Created ${days} day${days > 1 ? 's' : ''} ago`;
                if (hours > 0) return `Created ${hours} hour${hours > 1 ? 's' : ''} ago`;
                if (minutes > 0) return `Created ${minutes} minute${minutes > 1 ? 's' : ''} ago`;
                return `Created just now`;
            }

            // Initialize comment counts
            Object.values(posts).forEach(p => {
                p.comments = p.commentList.length;
            });

            const postsColumn = document.getElementById("postsColumn");
            let currentPostIndex = null;
            let savedScrollY = 0;

            // Render joined communities in Tab
            function renderJoinedCommunities() {
                const desktopNav = document.getElementById("sidebar-nav");
                const mobileNav = document.querySelector("#sidebar-nav-mobile .nav");

                // Target the actual Add More + button
                const desktopAddMore = desktopNav.querySelector('.nav-btn');
                const mobileAddMore = mobileNav.querySelector('.nav-btn');

                // Remove old joined buttons
                desktopNav.querySelectorAll(".joined-community-btn").forEach(btn => btn.remove());
                mobileNav.querySelectorAll(".joined-community-btn").forEach(btn => btn.remove());

                joinedCommunities.forEach(c => {
                    const targetId = `#community_${c.toLowerCase().replace(/\s+/g, "_")}`;

                    const desktopBtn = document.createElement("button");
                    desktopBtn.className = "btn btn-outline-primary joined-community-btn";
                    desktopBtn.setAttribute("data-bs-toggle", "tab");
                    desktopBtn.setAttribute("type", "button");
                    desktopBtn.setAttribute("data-bs-target", targetId);
                    desktopBtn.textContent = c;
                    desktopBtn.addEventListener("click", () => {
                        showCommunityPage(c);

                        // Close details panel if open
                        document.getElementById("postPanel").classList.add("d-none");
                        document.getElementById("postsWrapper").classList.remove("d-none");

                        window.scrollTo({ top: 0, behavior: "auto" });
                    });

                    // Insert before Add More + button
                    desktopNav.insertBefore(desktopBtn, desktopAddMore);

                    const mobileBtn = desktopBtn.cloneNode(true);
                    mobileBtn.addEventListener("click", () => {
                        showCommunityPage(c);

                        // Close details panel if open
                        document.getElementById("postPanel").classList.add("d-none");
                        document.getElementById("postsWrapper").classList.remove("d-none");

                        window.scrollTo({ top: 0, behavior: "auto" });
                    });
                    mobileNav.insertBefore(mobileBtn, mobileAddMore);
                });

                // Bind syncing for all tab buttons
                const allButtons = document.querySelectorAll('[data-bs-toggle="tab"]');
                allButtons.forEach(btn => {
                    btn.addEventListener("shown.bs.tab", function(e) {
                        const target = e.target.getAttribute("data-bs-target");

                        allButtons.forEach(b => b.classList.remove("active"));
                        document.querySelectorAll('[data-bs-target="' + target + '"]').forEach(b => b.classList.add("active"));

                        localStorage.setItem("activeTab", target);
                        window.scrollTo({ top: 0, behavior: "auto" });
                    });
                });
            }

            // Activate Community Tab (For when you click on a tag while on a different filter tab)
            function activateCommunityTab(communityName) {
                const targetId = `#community_${communityName.toLowerCase().replace(/\s+/g, "_")}`;
                document.querySelectorAll('[data-bs-toggle="tab"]').forEach(btn => {
                    btn.classList.remove("active");
                    if (btn.getAttribute("data-bs-target") === targetId) {
                        btn.classList.add("active");
                    }
                });
                localStorage.setItem("activeTab", targetId);
            }

            // Loads Community Banner and Posts//
            function showCommunityPage(communityName) {
                currentCommunity = communityName;
                const banner = document.getElementById("communityBanner");
                banner.style.display = "block";

                const community = communities.find(c => c.name.toLowerCase() === communityName.toLowerCase());

                // Set banner content dynamically
                if (community && community.banner) {
                    banner.querySelector("img").src = community.banner;
                    banner.querySelector("img").alt = community.name;
                } else {
                    banner.querySelector("img").src = "Images/default_banner.jpg"; // fallback

                document.getElementById("communityTitle").textContent = communityName;

                document.getElementById("communityDesc").textContent = community?.description

                // Sort newest first
                communityPosts.sort((a, b) => b.createdAt - a.createdAt);
                communityPosts.forEach(post => {
                    postsColumn.innerHTML += `
                        <div class="card p-2 w-100 mx-auto mt-3 post-card" style="max-width:800px;" data-id="${post.id}">
                            <table class="table table-borderless mb-0">

                                    <tr>
                                        <td>
                                            <div class="d-flex justify-content-between align-items-center">
                                            <div class="d-flex align-items-center">

                                                ? `<button class="modify-btn btn btn-outline-warning btn-sm" data-id="${post.id}">

                                                    <span class="ms-2">${post.commentList.length}</span>

                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    `;
                });

                // Like Logic
                document.querySelectorAll(".like-btn").forEach(heart => {
                    const card = heart.closest(".post-card");
                    const postId = parseInt(card.dataset.id);
                    const post = posts[postId];

                    // If already liked, mark it red
                    if (post.likes.includes(currentUser)) {
                        heart.classList.add("liked");
                    }

                    heart.addEventListener("click", e => {
                        e.stopPropagation(); // prevent triggering the card click

                        if (currentUser === "Guest") {
                            alert("You must log in to like posts.");
                            return;
                        }

                        const userIndex = post.likes.indexOf(currentUser);
                        if (userIndex === -1) {
                            post.likes.push(currentUser);
                            savePosts();
                            heart.classList.add("liked");
                        } else {
                            post.likes.splice(userIndex, 1);
                            savePosts();
                            heart.classList.remove("liked");
                        }

                        // Update the like counter
                        const likeCountEl = heart.nextElementSibling;
                        likeCountEl.textContent = post.likes.length;
                    });
                });
                // Open post and comment
                document.querySelectorAll(".post_comments-btn").forEach(commentIcon => {
                    const card = commentIcon.closest(".post-card");
                    const postId = parseInt(card.dataset.id);

                    commentIcon.parentElement.addEventListener("click", e => {
                        e.stopPropagation(); // prevent triggering the card click

                        if (currentUser === "Guest") {
                            alert("You must log in to comment.");
                            return;
                        }

                        savedScrollY = window.scrollY;
                        currentPostIndex = postId;
                        const post = posts[postId];

                        addToRecentlyViewed(postId);

                        // --- reuse your detail panel setup logic ---
                        document.getElementById("panelUsername").textContent = post.username === currentUser ? "You" : post.username;
                        document.getElementById("panelDateCreated").textContent = timeAgo(post.createdAt);
                        document.getElementById("panelDateCreated").dataset.createdAt = post.createdAt.toISOString();
                        document.getElementById("panelTitle").textContent = post.title;

                        const panelImage = document.getElementById("panelImage");
                        if (post.image) {

                            panelImage.style.display = "block";

                        let descEl = document.getElementById("panelDesc");
                        if (!descEl) {
                            descEl = document.createElement("p");
                            descEl.id = "panelDesc";
                            descEl.classList.add("mt-2");

                        descEl.textContent = post.description || "";

                        document.getElementById("panelLikes").textContent = post.likes.length;
                        document.getElementById("panelComments").textContent = post.commentList.length;

                        renderComments(post);
                        renderRecentlyViewed();

                        document.getElementById("postsWrapper").classList.add("d-none");
                        document.getElementById("postPanel").classList.remove("d-none");

                        window.scrollTo(0, 0);

                        // --- immediately focus the comment box ---
                        const commentBox = document.querySelector("#postPanel textarea");
                        if (commentBox) {
                            commentBox.focus();
                        }
                    });
                });
                // Modify Post
                document.querySelectorAll(".modify-btn").forEach(btn => {
                    btn.addEventListener("click", e => {

                        const postId = parseInt(btn.dataset.id || document.getElementById("modifyModal").dataset.postId || currentPostIndex);
                        const post = posts[postId];

                        document.getElementById("modifyTitle").value = post.title || "";
                        document.getElementById("modifyDesc").value = post.description || "";
                        document.getElementById("modifyImage").value = ""; // clear file input

                        document.getElementById("modifyModal").dataset.postId = postId;

                        const modal = new bootstrap.Modal(document.getElementById("modifyModal"));
                        modal.show();
                    });
                });
                // Make Posts Clickable //
                document.querySelectorAll(".post-card").forEach(card => {
                    card.addEventListener("click", () => {
                    savedScrollY = window.scrollY;

                    const postId = parseInt(card.dataset.id); // dataset.id instead of index
                    const post = posts[postId];
                    currentPostIndex = postId;

                    addToRecentlyViewed(postId);

                    // Same detail panel setup as renderPosts
                    let panelCommunity = document.getElementById("panelCommunity");
                    if (!panelCommunity) {
                        panelCommunity = document.createElement("span");
                        panelCommunity.id = "panelCommunity";
                        panelCommunity.classList.add("badge", "bg-primary", "ms-2");
                        document.getElementById("panelProfile").insertAdjacentElement("beforebegin", panelCommunity);

                    if (post.community) {

                    }

                    document.getElementById("panelUsername").textContent = post.username === currentUser ? "You" : post.username;
                    document.getElementById("panelDateCreated").textContent = timeAgo(post.createdAt);
                    document.getElementById("panelDateCreated").dataset.createdAt = post.createdAt.toISOString();
                    document.getElementById("panelTitle").textContent = post.title;

                    const panelImage = document.getElementById("panelImage");
                    if (post.image) {
                        panelImage.src = post.image;
                        panelImage.style.display = "block";
                    } else {
                        panelImage.src = "";
                        panelImage.style.display = "none";
                    }

                    let descEl = document.getElementById("panelDesc");
                    if (!descEl) {
                        descEl = document.createElement("p");
                        descEl.id = "panelDesc";
                        descEl.classList.add("mt-2");
                        panelImage.insertAdjacentElement("afterend", descEl);
                    }
                    descEl.textContent = post.description || "";

                    document.getElementById("panelLikes").textContent = post.likes.length;
                    document.getElementById("panelComments").textContent = post.commentList.length;

                    renderComments(post);
                    renderRecentlyViewed();

                    document.getElementById("postsWrapper").classList.add("d-none");
                    document.getElementById("postPanel").classList.remove("d-none");

                    // Updates Data Preset when opening "modify" and button's visibility
                    if (post.deleted) {
                        panelBtn.classList.add("d-none");
                        panelBtn.removeAttribute("data-id");
                    } else if (post.username === currentUser) {
                        panelBtn.classList.remove("d-none");
                        panelBtn.dataset.id = postId;
                    } else {
                        panelBtn.classList.add("d-none");
                        panelBtn.removeAttribute("data-id");
                    }

                    // Like Function of Post in Details Panel
                    const panelHeart = document.querySelector(".panel_like-btn");
                    panelHeart.classList.remove("liked"); // reset state
                    if (post.likes.includes(currentUser)) {
                        panelHeart.classList.add("liked");
                    }
                    panelHeart.replaceWith(panelHeart.cloneNode(true));
                    const newPanelHeart = document.querySelector(".panel_like-btn");

                    newPanelHeart.addEventListener("click", e => {
                        if (currentUser === "Guest") {
                            alert("You must log in to like posts.");
                            return;
                        }

                        const post = posts[currentPostIndex];
                        const heart = e.currentTarget;

                        const userIndex = post.likes.indexOf(currentUser);
                        if (userIndex === -1) {
                            post.likes.push(currentUser);
                            savePosts();
                            heart.classList.add("liked");
                        } else {
                            post.likes.splice(userIndex, 1);
                            savePosts();
                            heart.classList.remove("liked");
                        }

                        document.getElementById("panelLikes").textContent = post.likes.length;

                        if (currentCommunity) {
                            showCommunityPage(currentCommunity);
                        } else {
                            renderPosts(currentFilter);
                        }
                    });

                    // Jumps to commenting when comment btn is clicked from in Details Panel
                    const panelCommentBtn = document.querySelector(".panel_comments-btn");
                    if (panelCommentBtn) {
                        // wipe old listeners
                        panelCommentBtn.replaceWith(panelCommentBtn.cloneNode(true));
                        const newPanelCommentBtn = document.querySelector(".panel_comments-btn");

                        newPanelCommentBtn.addEventListener("click", e => {
                            e.stopPropagation();

                            if (currentUser === "Guest") {
                                alert("You must log in to comment.");
                                return;
                            }

                            const commentBox = document.querySelector("#postPanel textarea");
                            if (commentBox) {
                                document.getElementById("postPanel").classList.remove("d-none");
                                document.getElementById("postsWrapper").classList.add("d-none");
                                commentBox.focus();
                                commentBox.scrollIntoView({ behavior: "smooth", block: "center" });
                            }
                        });
                    }
                    
                    window.scrollTo(0, 0);
                    });
                });
                
                const joinBtn = document.getElementById("joinCommunityBtn");
                if (community && community.members.includes(currentUser)) {
                    joinBtn.textContent = "Leave";
                    joinBtn.classList.remove("btn-outline-primary");
                    joinBtn.classList.add("btn-outline-danger"); // red outline
                } else {
                    joinBtn.textContent = "Join";
                    joinBtn.classList.remove("btn-outline-danger");
                    joinBtn.classList.add("btn-outline-primary"); // back to original
                }

                joinBtn.onclick = () => {
                    if (community) {
                        if (community.members.includes(currentUser)) {
                            // --- Leave flow ---
                            community.members = community.members.filter(u => u !== currentUser);
                            saveCommunityMembers();
                            joinedCommunities = joinedCommunities.filter(c => c !== currentCommunity);

                            alert(`You left ${currentCommunity}.`);
                            renderJoinedCommunities();

                            // Update button back to Join (blue)
                            joinBtn.textContent = "Join";
                            joinBtn.classList.remove("btn-outline-danger");
                            joinBtn.classList.add("btn-outline-primary");
                        } else {
                            // --- Join flow ---
                            community.members.push(currentUser);
                            saveCommunityMembers();
                            if (!joinedCommunities.includes(currentCommunity)) {
                                joinedCommunities.push(currentCommunity);
                            }

                            alert(`You joined ${currentCommunity}!`);
                            renderJoinedCommunities();
                            activateCommunityTab(currentCommunity);

                            // Update button to Leave (red)
                            joinBtn.textContent = "Leave";
                            joinBtn.classList.remove("btn-outline-primary");
                            joinBtn.classList.add("btn-outline-danger");
                        }
                    }
                    document.getElementById("MemberCount").textContent = community?.members.length
                };

                activateCommunityTab(communityName)
            }

            // Modify Button Via Panel Details
            const panelBtn = document.getElementById("panelModifyBtn");
            panelBtn.addEventListener("click", e => {
                e.stopPropagation();

                const postId = parseInt(
                    panelBtn.dataset.id ||
                    document.getElementById("modifyModal").dataset.postId ||
                    currentPostIndex
                );
                const post = posts[postId];

                document.getElementById("modifyTitle").value = post.title || "";
                document.getElementById("modifyDesc").value = post.description || "";
                document.getElementById("modifyImage").value = "";

                document.getElementById("modifyModal").dataset.postId = postId;

                const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById("modifyModal"));
                modal.show();
            });
            // Save Modified Changes Button
            document.getElementById("saveChangesBtn").addEventListener("click", async () => {
                const postId = parseInt(document.getElementById("modifyModal").dataset.postId);
                const post = posts[postId];

                // Grab new values from modal inputs
                const newTitle = document.getElementById("modifyTitle").value.trim();
                const newDesc = document.getElementById("modifyDesc").value.trim();
                const imageInput = document.getElementById("modifyImage");

                // Update post object
                post.title = newTitle || post.title;
                post.description = newDesc || post.description;

                if (imageInput.files[0]) {
                    post.image = await fileToBase64(imageInput.files[0]);
                }

                // Close modal
                bootstrap.Modal.getInstance(document.getElementById("modifyModal")).hide();
                savePosts();

                // Update details panel if this post is currently open
                if (currentPostIndex === postId) {
                    document.getElementById("panelTitle").textContent = post.title;
                    document.getElementById("panelDesc").textContent = post.description || "";

                    const panelImage = document.getElementById("panelImage");
                    if (post.image) {
                        panelImage.src = post.image;
                        panelImage.style.display = "block";
                    } else {
                        panelImage.src = "";
                        panelImage.style.display = "none";
                    }
                }

                // Re-render posts and recently viewed
                if (shuffledFeed) {
                    const index = shuffledFeed.findIndex(p => p.id == postId);
                    if (index !== -1) {
                        shuffledFeed[index] = { id: postId, ...post };
                    }
                }

                renderRecentlyViewed()
                if (currentCommunity) {
                    showCommunityPage(currentCommunity);
                } else {
                    renderPosts(currentFilter);
                }
            });
            // Deletion of post
            document.getElementById("deletePostBtn").addEventListener("click", () => {
                const postId = parseInt(document.getElementById("modifyModal").dataset.postId);
                const post = posts[postId];

                // Replaces Data of Deleted Post (Except Likes and comments for post activity)
                post.title = "Content Deleted";
                post.description = "";
                post.image = null;
                post.community = "";
                post.topic = "";
                post.deleted = true;

                // Close modal
                bootstrap.Modal.getInstance(document.getElementById("modifyModal")).hide();
                savePosts();

                // If currently viewing this post in details panel, close it and return to feed
                if (currentPostIndex === postId) {
                    document.getElementById("postPanel").classList.add("d-none");
                    document.getElementById("postsWrapper").classList.remove("d-none");
                }

                // Re-render depending on context
                if (shuffledFeed) {
                    shuffledFeed = shuffledFeed.filter(p => p.id != postId);
                }

                renderRecentlyViewed()
                if (currentCommunity) {
                    showCommunityPage(currentCommunity);
                } else {
                    renderPosts(currentFilter);
                }
            });

            // Shuffle Posts //
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]]; // swap
                }
                return array;
            }

            let shuffledFeed = null;
            let lastFilter = null;
            // Render posts list and Filter them
            function renderPosts(filter = currentFilter) {
                postsColumn.innerHTML = "";

                let postArray = Object.entries(posts)
                    .map(([id, post]) => ({ id, ...post }))
                    .filter(p => !p.deleted);
                let filteredPosts = postArray;


                if (filter === "feed") {
                    // Shuffle only if filter changed or cache is empty
                    if (lastFilter !== "feed" || !shuffledFeed) {
                        shuffledFeed = shuffleArray([...postArray]);
                    }
                    filteredPosts = shuffledFeed;
                } else if (filter === "popular") {
                    filteredPosts = [...postArray].sort((a, b) => b.likes.length - a.likes.length);
                } else if (filter === "recent") {
                    filteredPosts = [...postArray].sort((a, b) => b.createdAt - a.createdAt);
                } else if (filter === "my_posts") {
                    filteredPosts = postArray.filter(p => p.username === currentUser);
                } else if (filter === "all_communities") {
                    filteredPosts = postArray.filter(p => p.community && p.community.trim() !== "");
                } else {
                    filteredPosts = postArray.filter(p => p.topic.toLowerCase() === filter.toLowerCase());
                }

                lastFilter = filter;

                // Render the filteredPosts list
                filteredPosts.forEach(post => {
                    postsColumn.innerHTML += `
                        <div class="card p-2 w-100 mx-auto mt-3 post-card" style="max-width:800px;" data-id="${post.id}">
                            <table class="table table-borderless mb-0">
                                <tbody>
                                    ${
                                        post.community
                                            ? `<tr>

                                    commentBox.scrollIntoView({ behavior: "smooth", block: "center" });
                                }
                            });
                        }

                        renderComments(post);
                        renderRecentlyViewed();

                        document.getElementById("postsWrapper").classList.add("d-none");
                        document.getElementById("postPanel").classList.remove("d-none");
                        window.scrollTo(0, 0);
                    });
                });
            }

            // Loading Contents such as Posts //
            document.addEventListener("DOMContentLoaded", function() {
                // Saves previously chosen filter // 
                const savedFilter = localStorage.getItem("activeFilter");
                if (savedFilter) {
                    currentFilter = savedFilter;
                    renderPosts(currentFilter);
                } else {
                    renderPosts("feed"); // default
                }

                // Clone the same nav into mobile sidebar
                const nav = document.querySelector("#sidebar-nav").cloneNode(true);
                document.querySelector("#sidebar-nav-mobile").appendChild(nav);

                const allButtons = document.querySelectorAll('[data-bs-toggle="tab"]');

                // Restore last active tab from localStorage
                const lastTab = localStorage.getItem("activeTab");
                if (lastTab) {
                const trigger = document.querySelector('[data-bs-target="' + lastTab + '"]');
                if (trigger) {
                    // Use Bootstrap's Tab API to show it
                    const tab = new bootstrap.Tab(trigger);
                    tab.show();
                }
                }

                // Nav Syncing and Last Session Saving
                allButtons.forEach(btn => {
                    btn.addEventListener("shown.bs.tab", function(e) {
                        const target = e.target.getAttribute("data-bs-target");

                        // Remove active state from all buttons
                        allButtons.forEach(b => b.classList.remove("active"));

                        // Add active to all buttons pointing to the same target
                        document.querySelectorAll('[data-bs-target="' + target + '"]').forEach(b => b.classList.add("active"));

                        // Save active tab to localStorage
                        localStorage.setItem("activeTab", target);

                        // Scroll to top
                        const mainContent = document.querySelector(".tab-content");
                        if (mainContent) {
                            mainContent.scrollTop = 0;
                        }
                        window.scrollTo({ top: 0, behavior: "auto" });
                    });
                });

                // Close details posts upon tab change
                document.querySelectorAll('[data-bs-toggle="tab"]').forEach(btn => {
                    btn.addEventListener("shown.bs.tab", function() {
                        // Always hide the post detail panel when switching tabs
                        document.getElementById("postPanel").classList.add("d-none");
                        document.getElementById("postsWrapper").classList.remove("d-none");
                        document.getElementById("communityBanner").style.display = "none";

                        // Reset scroll position
                        window.scrollTo({ top: 0, behavior: "auto" });
                    });
                });

                // Filter Contents //
                document.querySelectorAll('[data-bs-toggle="tab"]').forEach(btn => {
                    btn.addEventListener("shown.bs.tab", function(e) {
                        currentCommunity = null; // leaving community view
                        document.getElementById("communityBanner").style.display = "none";

                        const target = e.target.getAttribute("data-bs-target");

                        let filter = "feed"; // default
                        if (target === "#feed") filter = "feed";
                        if (target === "#popular") filter = "popular";
                        if (target === "#recent") filter = "recent";
                        if (target === "#my_posts") filter = "my_posts";

                        if (target === "#review") filter = "Work Review";
                        if (target === "#concepts") filter = "Concepts";
                        if (target === "#tips") filter = "Tips";
                        if (target === "#debugging") filter = "Debugging";
                        if (target === "#modeling") filter = "Modeling";
                        if (target === "#monetization") filter = "Monetization";
                        if (target === "#featureSuggestions") filter = "Feature Suggestion";

                        if (target === "#all_communities") filter = "all_communities";

                        currentFilter = filter;
                        localStorage.setItem("activeFilter", filter);
                        renderPosts(filter);
                    });
                });
                renderJoinedCommunities();
            });
            if (currentCommunity) {
                showCommunityPage(currentCommunity);
            } else {
                renderPosts(currentFilter);
            }
            
            // Updates all posts creation time
            function refreshTimestamps() {
                document.querySelectorAll("[data-created-at]").forEach(el => {
                    const dateStr = el.dataset.createdAt;
                    if (dateStr) {
                    el.textContent = timeAgo(new Date(dateStr));
                    }
                });
            }

            renderRecentlyViewed();
            updateJoinedCommunities()

            // For testing purposes! (reverts posts to their original hardcoded state)
            function resetAppData() {
                // Clear posts
                localStorage.removeItem("posts");

                // Clear community membership
                localStorage.removeItem("communityMembers");

                // Clear recently viewed (per-user history)
                localStorage.removeItem("recentlyViewed");

                // Reload seed data
                loadPosts();
                loadCommunityMembers();
                loadRecentlyViewed();

                // Re-render everything
                updateJoinedCommunities();
                renderJoinedCommunities();
                renderPosts(currentFilter);
                renderRecentlyViewed();

                alert("Posts, communities, and recently viewed have been reset to defaults.");
            }
            // resetAppData()
            setInterval(refreshTimestamps, 30000); // 30 seconds
        </script>
    </body>
</html>
