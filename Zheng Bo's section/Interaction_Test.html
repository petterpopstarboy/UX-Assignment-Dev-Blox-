<html>
  <body>
    <h2>Regular Union Playground</h2>
    <canvas id="unionCanvas" width="500" height="300" style="border: 2px solid black; border-radius: 15px;"></canvas>
    <div>
      <button onclick="spawnRect('union')">Spawn Rectangle</button>
      <button onclick="spawnCircle('union')">Spawn Circle</button>
      <button onclick="resetCanvas('union')">Reset</button>
      <button onclick="unionSelected('union')">Union</button>
    </div>

    <h2>Negative Union Playground</h2>
    <canvas id="negCanvas" width="500" height="300" style="border: 2px solid black; border-radius: 15px;"></canvas>
    <div>
      <button onclick="spawnRect('neg')">Spawn Rectangle</button>
      <button onclick="spawnCircle('neg')">Spawn Circle</button>
      <button onclick="resetCanvas('neg')">Reset</button>
      <button onclick="toggleNegative('neg')">Toggle Pos/Neg</button>
      <button onclick="unionSelected('neg')">Union</button>
    </div>

    <h2>Intersect Playground</h2>
    <canvas id="interCanvas" width="500" height="300" style="border: 2px solid black; border-radius: 15px;"></canvas>
    <div>
      <button onclick="spawnRect('inter')">Spawn Rectangle</button>
      <button onclick="spawnCircle('inter')">Spawn Circle</button>
      <button onclick="resetCanvas('inter')">Reset</button>
      <button onclick="intersectSelected('inter')">Intersect</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.15/paper-full.min.js"></script>
    <script>
      // Setup projects
      let projects = {
        union: new paper.Project(document.getElementById('unionCanvas')),
        neg: new paper.Project(document.getElementById('negCanvas')),
        inter: new paper.Project(document.getElementById('interCanvas'))
      };

      let shapes = { union: [], neg: [], inter: [] };
      let selected = { union: new Set(), neg: new Set(), inter: new Set() };

      // Spawn functions
      function spawnRect(type) {
        projects[type].activate();
        let rect = new paper.Path.Rectangle(new paper.Point(80, 80), new paper.Size(100, 60));
        rect.fillColor = 'blue';
        rect.isNegative = false;
        shapes[type].push(rect);
      }
      function spawnCircle(type) {
        projects[type].activate();
        let circle = new paper.Path.Circle(new paper.Point(150, 150), 40);
        circle.fillColor = 'red';
        circle.isNegative = false;
        shapes[type].push(circle);
      }

      // Reset
      function resetCanvas(type) {
        shapes[type].forEach(s => s.remove());
        shapes[type] = [];
        selected[type].clear();
      }

      // Selection + dragging
      for (let key of ['union','neg','inter']) {
        projects[key].activate();
        let dragging = null;
        let clickedShape = null;

        projects[key].view.onMouseDown = function(event) {
          clickedShape = null;
          // loop backwards so topmost shape is checked first
          for (let i = shapes[key].length - 1; i >= 0; i--) {
            let shape = shapes[key][i];
            if (shape.contains(event.point)) {
              clickedShape = shape;
              dragging = shape; // prepare for drag
              break;
            }
          }

          if (!clickedShape) {
            // click empty space → clear selection
            selected[key].forEach(s => { s.strokeColor = null; s.strokeWidth = 1; });
            selected[key].clear();
          }
        };

        projects[key].view.onMouseDrag = function(event) {
          if (dragging) {
            // move shape but do NOT toggle selection
            dragging.position = dragging.position.add(event.delta);
          }
        };

        projects[key].view.onMouseUp = function(event) {
          if (clickedShape) {
            // If mouse up happened without significant drag, toggle selection
            if (event.delta.length < 2) { // small movement = click
              if (selected[key].has(clickedShape)) {
                // deselect
                clickedShape.strokeColor = null;
                clickedShape.strokeWidth = 1;
                selected[key].delete(clickedShape);
              } else {
                // select
                clickedShape.strokeColor = 'yellow';
                clickedShape.strokeWidth = 3;
                selected[key].add(clickedShape);
              }
            }
          }
          dragging = null;
          clickedShape = null;
        };
      }


      // Toggle negative (only for neg canvas)
      function toggleNegative(type) {
        selected[type].forEach(shape => {
          shape.isNegative = !shape.isNegative;
          shape.fillColor = shape.isNegative ? 'black' : (shape instanceof paper.Path.Rectangle ? 'blue' : 'red');
        });
      }

      // Union operation
      function unionSelected(type) {
        if (selected[type].size < 2) return;
        projects[type].activate();
        let arr = Array.from(selected[type]);

        // Start with a clean clone of the first shape
        let result = arr[0].clone();
        result.strokeColor = null;
        result.strokeWidth = 0;
        result.fillColor = null;

        // Unite positives
        for (let i = 1; i < arr.length; i++) {
          if (!arr[i].isNegative) {
            result = result.unite(arr[i]);
          }
        }

        // Subtract negatives
        if (type === 'neg') {
          arr.forEach(s => {
            if (s.isNegative) {
              result = result.subtract(s);
            }
          });
        }

        // Remove originals (both pos and neg)
        arr.forEach(s => s.remove());
        shapes[type] = shapes[type].filter(s => !arr.includes(s));

        // Style the final result
        result.fillColor = 'green';
        result.strokeColor = 'yellow';
        result.strokeWidth = 3;

        // Track selection
        shapes[type].push(result);
        selected[type].clear();
        selected[type].add(result);
      }


      // Intersect operation
      function intersectSelected(type) {
        if (selected[type].size < 2) return;
        projects[type].activate();
        let arr = Array.from(selected[type]);

        // Start with a clean clone
        let result = arr[0].clone();
        result.strokeColor = null;
        result.strokeWidth = 0;

        for (let i = 1; i < arr.length; i++) {
          let temp = result.intersect(arr[i]);
          result.remove(); // remove old partial result
          result = temp;

          if (!result || result.isEmpty()) {
            // No common intersection → remove everything
            arr.forEach(s => s.remove());
            shapes[type] = shapes[type].filter(s => !arr.includes(s));
            selected[type].clear();
            if (result) result.remove(); // clean up leftover
            return;
          }
        }

        // Remove originals
        arr.forEach(s => s.remove());
        shapes[type] = shapes[type].filter(s => !arr.includes(s));

        // Add final result
        result.fillColor = 'purple';
        result.strokeColor = 'yellow';
        result.strokeWidth = 3;
        shapes[type].push(result);

        selected[type].clear();
        selected[type].add(result);
      }

    </script>
  </body>
</html>
